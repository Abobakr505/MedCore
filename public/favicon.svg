<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9CFF"/>
      <stop offset="55%" stop-color="#3B7BF0"/>
      <stop offset="100%" stop-color="#1A4FD1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background with soft shine -->
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect width="32" height="32" rx="9" fill="url(#shine)"/>

  <!-- Medical cross watermark -->
  <path d="M14 3.5h4v4.5h4.5v4H18v4.5h-4V12H9.5V8H14z" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Graduation-cap accent -->
  <path d="M16 2.2l5.5 2.3L16 6.8l-5.5-2.3L16 2.2z" fill="#FFFFFF" fill-opacity="0.55"/>
  <path d="M12.3 5.2v2.4c0 .9 1.65 1.6 3.7 1.6s3.7-.7 3.7-1.6V5.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.6"/>

  <!-- Thin outline ring -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="8.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Wordmark: softer weight, refined spacing -->
  <text x="16" y="21" font-size="12.5" font-family="'Poppins', 'Space Grotesk', 'Segoe UI', sans-serif" fill="#FFFFFF" text-anchor="middle" font-weight="600" letter-spacing="0.2">Med</text>
  <text x="16" y="28" font-size="7.5" font-family="'Poppins', 'Space Grotesk', 'Segoe UI', sans-serif" fill="#FFFFFF" text-anchor="middle" font-weight="500" letter-spacing="1.2">CORE</text>
</svg>